<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>coin flip</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    background: #0d1014;
    color: #e8ebee;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    position: fixed;
    -webkit-font-smoothing: antialiased;
  }

  #fxCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .app {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 36px 24px;
    padding-top: max(36px, env(safe-area-inset-top));
    padding-bottom: max(36px, env(safe-area-inset-bottom));
    padding-left: max(24px, env(safe-area-inset-left));
    padding-right: max(24px, env(safe-area-inset-right));
    gap: 12px;
  }

  header {
    flex-shrink: 0;
    text-align: center;
  }

  .logo {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -1px;
    color: #e8ebee;
    line-height: 1;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(28px, 5vh, 44px);
    min-height: 0;
  }

  .coin-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .result-label {
    font-size: 13px;
    color: #5c6169;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 600;
    min-height: 18px;
    transition: color 0.4s ease;
  }

  .result-label.heads {
    color: #fcc02a;
  }

  .result-label.tails {
    color: #5ecf7a;
  }

  .coin-wrap {
    width: clamp(140px, 42vw, 180px);
    height: clamp(140px, 42vw, 180px);
    perspective: 1200px;
    position: relative;
  }

  .coin {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1.6s cubic-bezier(0.2, 0.7, 0.3, 1);
    will-change: transform;
  }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 32% 28%, #fff0a8 0%, #ffd75e 30%, #fcc02a 60%, #c9930e 100%);
    box-shadow:
      inset 0 0 0 3px rgba(184, 134, 11, 0.55),
      inset 0 0 24px rgba(255, 255, 255, 0.4),
      inset 0 -14px 24px rgba(120, 80, 0, 0.32),
      0 8px 24px rgba(0, 0, 0, 0.4);
  }

  .face.back {
    transform: rotateY(180deg);
  }

  .face-inner {
    width: 74%;
    height: 74%;
    border-radius: 50%;
    border: 2px solid rgba(58, 42, 0, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #3a2a00;
  }

  .face-inner svg {
    width: 62%;
    height: 62%;
    display: block;
  }

  .spin-btn {
    padding: 16px 50px;
    border: none;
    background: #e8ebee;
    color: #0d1014;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: lowercase;
    border-radius: 100px;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.12s ease;
    min-width: 150px;
    -webkit-appearance: none;
    appearance: none;
  }

  .spin-btn:active:not(:disabled) {
    transform: scale(0.96);
    opacity: 0.9;
  }

  .spin-btn:disabled {
    opacity: 0.28;
    cursor: default;
  }

  .stats {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    min-height: 62px;
    justify-content: center;
  }

  .streak-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    transition: opacity 0.35s ease;
  }

  .streak-row.hidden {
    opacity: 0;
  }

  .streak-label {
    font-size: 11px;
    color: #5c6169;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .streak-value {
    font-size: 26px;
    font-weight: 800;
    color: #e8ebee;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
  }

  .probability {
    font-size: 12px;
    color: #5c6169;
    letter-spacing: 1.5px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    min-height: 16px;
    transition: opacity 0.35s ease;
    word-break: break-all;
    text-align: center;
  }

  .probability.hidden {
    opacity: 0;
  }

  @media (max-height: 620px) {
    .app {
      padding: 22px 20px;
    }
    .logo {
      font-size: 24px;
    }
    main {
      gap: 20px;
    }
    .coin-area {
      gap: 14px;
    }
    .stats {
      min-height: 52px;
    }
    .streak-value {
      font-size: 22px;
    }
  }
</style>
</head>
<body>

<canvas id="fxCanvas"></canvas>

<div class="app">
  <header>
    <div class="logo">coin flip</div>
  </header>

  <main>
    <div class="coin-area">
      <div class="coin-wrap">
        <div class="coin" id="coin">
          <div class="face front">
            <div class="face-inner">
              <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
                <path d="M 22 74 L 22 50 L 36 64 L 50 36 L 64 64 L 78 50 L 78 74 Z" />
              </svg>
            </div>
          </div>
          <div class="face back">
            <div class="face-inner">
              <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
                <path d="M 50 18 L 61 41 L 86 44 L 68 61 L 73 87 L 50 74 L 27 87 L 32 61 L 14 44 L 39 41 Z" />
              </svg>
            </div>
          </div>
        </div>
      </div>

      <div class="result-label" id="resultLabel">tap spin to begin</div>
    </div>

    <button class="spin-btn" id="spinBtn">spin</button>
  </main>

  <div class="stats">
    <div class="streak-row hidden" id="streakRow">
      <span class="streak-label">streak</span>
      <span class="streak-value" id="streakValue">1x</span>
    </div>
    <div class="probability hidden" id="probability"></div>
  </div>
</div>

<script>
(() => {
'use strict';

const coin = document.getElementById('coin');
const spinBtn = document.getElementById('spinBtn');
const resultLabel = document.getElementById('resultLabel');
const streakRow = document.getElementById('streakRow');
const streakValue = document.getElementById('streakValue');
const probability = document.getElementById('probability');

const fxCanvas = document.getElementById('fxCanvas');
const fx = fxCanvas.getContext('2d');

const FLIP_DURATION_MS = 1600;

let currentRotation = 0;
let currentFace = 'heads';
let isFlipping = false;
let streak = 0;
let lastResult = null;

let fxW = 0, fxH = 0, fxDPR = 1;
let particles = [];
let fxRunning = false;
let lastFxTs = 0;

coin.style.transform = 'rotateY(0deg)';

function secureRandom() {
  if (window.crypto && window.crypto.getRandomValues) {
    const arr = new Uint32Array(1);
    window.crypto.getRandomValues(arr);
    return arr[0] / 4294967296;
  }
  return Math.random();
}

function formatPercent(streakCount) {
  const denominator = Math.pow(2, streakCount);
  const percent = 100 / denominator;

  if (percent <= 0) {
    return '1/' + denominator + ' \u00B7 0%';
  }

  let pctStr = percent.toFixed(4);
  pctStr = pctStr.replace(/0+$/, '').replace(/\.$/, '');

  if (pctStr === '0' || pctStr === '') {
    pctStr = percent.toExponential(3);
  }

  return '1/' + denominator + ' \u00B7 ' + pctStr + '%';
}

function fxResize() {
  fxDPR = Math.min(window.devicePixelRatio || 1, 2);
  fxW = window.innerWidth;
  fxH = window.innerHeight;
  fxCanvas.width = Math.round(fxW * fxDPR);
  fxCanvas.height = Math.round(fxH * fxDPR);
  fx.setTransform(fxDPR, 0, 0, fxDPR, 0, 0);
}

window.addEventListener('resize', fxResize);
window.addEventListener('orientationchange', () => setTimeout(fxResize, 200));

function getCoinCenter() {
  const rect = coin.getBoundingClientRect();
  return {
    x: rect.left + rect.width / 2,
    y: rect.top + rect.height / 2
  };
}

function emitStreakGain(streakCount) {
  const c = getCoinCenter();
  const intensity = Math.min(1 + (streakCount - 2) * 0.28, 3.2);
  const count = Math.min(Math.round(14 + streakCount * 7), 90);
  const force = 180 + streakCount * 32;

  for (let i = 0; i < count; i++) {
    const angle = -Math.PI / 2 + (secureRandom() - 0.5) * Math.PI * 1.5;
    const speed = force * (0.55 + secureRandom() * 0.9);
    const isBright = secureRandom() > 0.35;

    particles.push({
      x: c.x + (secureRandom() - 0.5) * 16,
      y: c.y + (secureRandom() - 0.5) * 16,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      gravity: 340,
      drag: 0.32,
      life: 0.9 + secureRandom() * 0.6,
      maxLife: 1.5,
      size: (2.2 + secureRandom() * 2.6) * intensity * 0.85,
      color: isBright ? '#fff0a8' : '#fcc02a',
      glow: true
    });
  }
}

function emitStreakLost(prevStreak) {
  const c = getCoinCenter();
  const intensity = Math.min(1 + (prevStreak - 1) * 0.22, 2.8);
  const count = Math.min(Math.round(16 + prevStreak * 6), 85);
  const force = 90 + prevStreak * 20;

  for (let i = 0; i < count; i++) {
    const angle = Math.PI / 2 + (secureRandom() - 0.5) * Math.PI * 1.6;
    const speed = force * (0.5 + secureRandom() * 0.8);
    const isLight = secureRandom() > 0.5;

    particles.push({
      x: c.x + (secureRandom() - 0.5) * 18,
      y: c.y + (secureRandom() - 0.5) * 18,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      gravity: 720,
      drag: 0.4,
      life: 0.75 + secureRandom() * 0.5,
      maxLife: 1.25,
      size: (1.8 + secureRandom() * 2.2) * intensity * 0.85,
      color: isLight ? '#6f7686' : '#3a3f4a',
      glow: false
    });
  }
}

function startFxLoop() {
  if (fxRunning) return;
  fxRunning = true;
  lastFxTs = 0;
  requestAnimationFrame(fxLoop);
}

function fxLoop(ts) {
  const dt = lastFxTs ? Math.min((ts - lastFxTs) / 1000, 0.05) : 0.016;
  lastFxTs = ts;

  fx.clearRect(0, 0, fxW, fxH);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += p.gravity * dt;
    p.vx *= Math.pow(p.drag, dt);
    p.vy *= Math.pow(1 - (1 - p.drag) * 0.4, dt);
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;

    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }

    const t = p.life / p.maxLife;
    const alpha = Math.min(1, t * 1.4);
    const radius = p.size * (0.4 + t * 0.8);

    fx.globalAlpha = alpha;
    fx.fillStyle = p.color;

    if (p.glow) {
      fx.shadowColor = p.color;
      fx.shadowBlur = 10;
    }

    fx.beginPath();
    fx.arc(p.x, p.y, radius, 0, Math.PI * 2);
    fx.fill();

    if (p.glow) fx.shadowBlur = 0;
  }

  fx.globalAlpha = 1;

  if (particles.length > 0) {
    requestAnimationFrame(fxLoop);
  } else {
    fxRunning = false;
    fx.clearRect(0, 0, fxW, fxH);
  }
}

function spin() {
  if (isFlipping) return;

  isFlipping = true;
  spinBtn.disabled = true;

  const result = secureRandom() < 0.5 ? 'heads' : 'tails';
  const prevResult = lastResult;
  const prevStreak = streak;

  let streakGained = false;
  let streakLost = false;

  if (prevResult === null) {
    streak = 1;
  } else if (prevResult === result) {
    streak = prevStreak + 1;
    streakGained = true;
  } else {
    streak = 1;
    streakLost = true;
  }

  lastResult = result;

  let halfTurns;
  if (result === currentFace) {
    halfTurns = 8;
  } else {
    halfTurns = 9;
  }

  const extraFull = Math.floor(secureRandom() * 2);
  halfTurns += extraFull * 2;

  currentRotation += halfTurns * 180;
  coin.style.transform = 'rotateY(' + currentRotation + 'deg)';
  currentFace = result;

  setTimeout(() => {
    isFlipping = false;
    spinBtn.disabled = false;

    resultLabel.textContent = result;
    resultLabel.classList.remove('heads', 'tails');
    resultLabel.classList.add(result);

    streakRow.classList.remove('hidden');
    streakValue.textContent = streak + 'x';

    probability.classList.remove('hidden');
    probability.textContent = formatPercent(streak);

    if (streakGained) {
      emitStreakGain(streak);
      startFxLoop();
    } else if (streakLost) {
      emitStreakLost(prevStreak);
      startFxLoop();
    }
  }, FLIP_DURATION_MS + 100);
}

spinBtn.addEventListener('click', spin);

fxResize();

})();
</script>
</body>
      </html>
